name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config (`radar-cam-recorder check-config`) and steps.
      render: shell
  - type: textarea
    id: info
    attributes:
      label: Environment
      description: Board and OS, Python version, camera module, `rpicam-vid --version`, and the `ld2451` version.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u radar-cam-recorder`, `radar-cam-recorder status`, and the session's `events.jsonl` or `inspect --json` output, if relevant."
      render: text
