[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-cam-recorder"
version = "0.1.0"
description = "Unattended Raspberry Pi recorder for time-aligned camera video and HLK-LD2451 radar data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bruno Mendonça" }]
keywords = ["raspberry-pi", "radar", "ld2451", "hlk-ld2451", "rpicam", "camera", "speed-trap", "data-logger", "systemd"]
dependencies = ["ld2451", 'tomli; python_version < "3.11"']
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bfMendonca/radar-cam-recorder"
Issues = "https://github.com/bfMendonca/radar-cam-recorder/issues"
Changelog = "https://github.com/bfMendonca/radar-cam-recorder/blob/master/CHANGELOG.md"

[project.scripts]
radar-cam-recorder = "radar_cam_recorder.cli:main"

[dependency-groups]
test = ["pytest>=7", "hypothesis>=6.100,<6.142"]  # 6.142+ needs a Rust build on ARMv6
dev = ["ruff>=0.5", "mypy>=1.10,<1.20", "pytest-cov>=4", "types-pyserial"]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
ld2451 = { git = "https://github.com/bfMendonca/ld2451.git", branch = "main" }

[tool.setuptools.packages.find]
include = ["radar_cam_recorder*"]

[tool.setuptools.package-data]
radar_cam_recorder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pi: needs the Raspberry Pi camera/radar (skipped unless --pi)"]
addopts = "-ra"

[tool.coverage.run]
source = ["radar_cam_recorder"]
branch = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["radar_cam_recorder", "tests"]

[[tool.mypy.overrides]]
module = ["tomli"]  # only installed (and imported) on Python < 3.11
ignore_missing_imports = true
