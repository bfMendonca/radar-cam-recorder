[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-cam-recorder"
version = "0.1.0"
description = "Record Raspberry Pi camera video and HLK-LD2451 radar data"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["ld2451", 'tomli; python_version < "3.11"']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.scripts]
radar-cam-recorder = "radar_cam_recorder.cli:main"

[dependency-groups]
test = ["pytest>=7", "hypothesis>=6.100,<6.142"]  # 6.142+ needs a Rust build on ARMv6
dev = ["ruff>=0.5", "mypy>=1.10,<1.20", "pytest-cov>=4", "types-pyserial"]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
ld2451 = { path = "../driver-hlk-ld2451", editable = true }

[tool.setuptools]
packages = ["radar_cam_recorder"]

[tool.setuptools.package-data]
radar_cam_recorder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pi: needs the Raspberry Pi camera/radar (skipped unless --pi)"]
addopts = "-ra"

[tool.coverage.run]
source = ["radar_cam_recorder"]
branch = true

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["radar_cam_recorder", "tests"]
mypy_path = "../driver-hlk-ld2451"  # editable path install is invisible to mypy

[[tool.mypy.overrides]]
module = ["tomli"]  # only installed (and imported) on Python < 3.11
ignore_missing_imports = true
